[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onprem-runner"
dynamic = ["version"]
description = "Run, schedule and monitor local/on-premise automation pipelines on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AOchoaArangoA" }]
keywords = ["automation", "pipeline", "windows", "on-premise", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
opr = "onprem_runner.cli:app"

[project.urls]
Homepage = "https://github.com/AOchoaArangoA/onprem-runner"
Issues = "https://github.com/AOchoaArangoA/onprem-runner/issues"

[tool.hatch.version]
path = "src/onprem_runner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onprem_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
