name: Desktop

on:
  push:
    branches: [main, master]
    paths: ["desktop/**", "src/**", "tests/**", "pyproject.toml", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "src/**", "tests/**", "pyproject.toml"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Unit tests of the front end and typecheck
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build:renderer
      - name: End-to-end tests (real engine, installed Chrome)
        working-directory: desktop
        env:
          OPR_BIN: opr
        run: npx playwright test -c e2e/playwright.config.ts studio.spec.ts

  package:
    # Builds the portable .exe on releases and manual runs; the artifact is the deliverable.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # attach the .exe to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the engine executable
        run: python desktop/engine/build_engine.py
      - name: Build the portable app
        working-directory: desktop
        run: |
          npm ci
          npm run dist
      - name: Tests of the built app
        working-directory: desktop
        run: npx playwright test -c e2e/playwright.config.ts packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: OPR-Studio-portable
          path: desktop/release/OPR-Studio-*-portable.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/OPR-Studio-*-portable.exe
